# n8n Twitter AI/ML Reply Automation
# n8n + n8n-nodes-puppeteer + Chromium, with data volume for replyCount, repliedIds, cookies
# See docs/setup.md for env vars, credentials, and first run.

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-puppeteer:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - NODE_FUNCTION_ALLOW_EXTERNAL=puppeteer
      # Allow fs and https in Code nodes (for /data files and Groq API calls)
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,https
      # Load n8n-nodes-puppeteer from the image (package root)
      - N8N_CUSTOM_EXTENSIONS=/opt/n8n-custom-nodes/node_modules/n8n-nodes-puppeteer
      # Twitter automation config (see docs/setup.md)
      - TARGET_REPLIES=${TARGET_REPLIES:-50}
      - BATCH_SIZE=${BATCH_SIZE:-5}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Optional: only if using password auth instead of cookies
      - X_USER=${X_USER:-}
      - X_PASSWORD=${X_PASSWORD:-}
    volumes:
      # n8n DB, workflows, config
      - ./n8n_data:/home/node/.n8n
      # replyCount.json, repliedIds.json, config.json, cookies.json
      - ./data:/data
    # Security options for Chromium sandbox (required in Docker)
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
